<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CubeSweep</title>
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="assets/css/controls-popup.css">
</head>
<body>

    <canvas id="renderCanvas" tabindex="0"></canvas>
    <div id="error-message"></div>
    <button id="controls-toggle" title="Show controls">
        <img src="./assets/keyboard.svg" alt="Keyboard Icon" width="28" height="28">
    </button>
    <div id="controls-popup"></div>

    <!-- Babylon.js from CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>

    <!-- Controls popup logic -->
    <script src="src/client/controls-popup.js"></script>

    <!-- Application code -->
    <script src="src/client/preferences.js" type="module"></script>
    <script src="src/client/main.js" type="module"></script>
</body>
</html>
