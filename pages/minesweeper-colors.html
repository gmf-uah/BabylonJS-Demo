<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Minesweeper Number Colors</title>
        <link rel="stylesheet" href="../assets/css/minesweeper-colors.css" />
    </head>
    <body>
        <table>
            <tr>
                <th>Number</th>
                <th>Color</th>
                <th>Hex Code</th>
            </tr>
            <tr>
                <td class="number-value number-1">1</td>
                <td class="color-cell">
                    <span
                        class="color-preview preview-1"
                    ></span
                    ><span>Blue</span>
                </td>
                <td>#0000FF</td>
            </tr>
            <tr>
                <td class="number-value number-2">2</td>
                <td class="color-cell">
                    <span
                        class="color-preview preview-2"
                    ></span
                    ><span>Green</span>
                </td>
                <td>#008200</td>
            </tr>
            <tr>
                <td class="number-value number-3">3</td>
                <td class="color-cell">
                    <span
                        class="color-preview preview-3"
                    ></span
                    ><span>Red</span>
                </td>
                <td>#FF0000</td>
            </tr>
            <tr>
                <td class="number-value number-4">4</td>
                <td class="color-cell">
                    <span
                        class="color-preview preview-4"
                    ></span
                    ><span>Dark Blue</span>
                </td>
                <td>#000084</td>
            </tr>
            <tr>
                <td class="number-value number-5">5</td>
                <td class="color-cell">
                    <span
                        class="color-preview preview-5"
                    ></span
                    ><span>Dark Red</span>
                </td>
                <td>#840000</td>
            </tr>
            <tr>
                <td class="number-value number-6">6</td>
                <td class="color-cell">
                    <span
                        class="color-preview preview-6"
                    ></span
                    ><span>Turquoise</span>
                </td>
                <td>#008284</td>
            </tr>
            <tr>
                <td class="number-value number-7">7</td>
                <td class="color-cell">
                    <span
                        class="color-preview preview-7"
                    ></span
                    ><span>Violet</span>
                </td>
                <td>#840084</td>
            </tr>
            <tr>
                <td class="number-value number-8">8</td>
                <td class="color-cell">
                    <span
                        class="color-preview preview-8"
                    ></span
                    ><span>Black</span>
                </td>
                <td>#000000</td>
            </tr>
        </table>
    </body>
</html>
