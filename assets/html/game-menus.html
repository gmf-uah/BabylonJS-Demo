<div id="controls-menu">
    <span class="controls-label">Controls</span><br>
    <span class="controls-key">WASD, QE</span> to move<br>
    <span class="controls-key">Hold RMB</span> to pan the camera<br>
    <span class="controls-key">C</span> to open this menu<br>
    <label class="pointer-lock-label">
        <input type="checkbox" id="pointer-lock-toggle" class="pointer-lock-toggle">
        <span>Enable Pointer Lock</span>
        <span class="pointer-lock-help">
            <span class="pointer-lock-help-icon">i</span>
            <span class="pointer-lock-help-tooltip">Locks cursor for smoother control<br>but triggers browser notifications</span>
        </span>
    </label>
</div>

<div id="settings-menu">
    <span class="controls-label">Settings</span>
</div>
